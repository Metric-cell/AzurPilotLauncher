[package]
name = "alas-launcher"
version = "2.2.4"
description = "AzurPilot launcher built with Tauri"
authors = ["Jianfeng Zhang <swordfeng123@gmail.com>"]
edition = "2021"
rust-version = "1.89"

[build-dependencies]
base64 = "0.22.1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2.2.0"
semver = "1"
rustls = { version = "0.23.38", default-features = false }
rand = "0.8"
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
base64 = "0.22.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.0.0"
ctrlc = "3.5.0"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
rust-i18n = "3"
sys-locale = "0.3"
tempfile = "3"

[package.metadata.alas-launcher.time-bomb]
enabled = false
expires-at = "2026-05-28T05:00:00+08:00"
network-time-url = "https://www.aliyun.com"
message = "测试已结束，请安装正式版"

[dev-dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.37.0"
winapi = { version = "0.3", features = ["consoleapi", "fileapi", "handleapi", "jobapi2", "minwinbase", "processthreadsapi", "processenv", "sddl", "synchapi", "sysinfoapi", "tlhelp32", "winbase", "winnt", "winuser", "jobapi", "iphlpapi", "tcpmib", "iprtrmib", "ws2def", "securitybaseapi", "winerror", "shellapi", "combaseapi", "objbase"] }
tauri-winrt-notification = "0.7.2"
windows-registry = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.1"
openssl-probe = "0.1.6"
notify-rust = "4.16.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
debug-assertions = false
overflow-checks = false
